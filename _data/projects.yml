- id: customer-segmentation-us
  title: "Customer Segmentation in the US"
  short: "Unsupervised learning project to segment US households based on credit access."
  long: "In this project, we used data from the 2019 Survey of Consumer Finances to identify households struggling to get credit and segmented them into subgroups using unsupervised learning techniques. We built a k-means clustering model, conducted feature selection, reduced dimensionality using PCA, and designed an interactive Dash web application to visualize the results. The project includes notebooks covering data exploration, clustering with two or multiple features, and dashboard deployment."
  image: "/assets/images/customer_segmentation_us.jpg"
  repo: "https://github.com/yourusername/customer-segmentation-us"
  demo: ""
  tags: ["Python","Machine Learning","Data Science","Clustering","K-Means","PCA","Dashboard"]





- id: ba-flight-performance
  title: "British Airways Flight Performance Analysis"
  short: "Analyzing and predicting British Airways flight performance using machine learning."
  long: "This project focuses on analyzing British Airways flight performance data to understand delays, cancellations, and operational efficiency. We performed data cleaning and exploratory data analysis (EDA) on historical flight datasets, built predictive models using Python and scikit-learn, handled missing values and categorical variables with pipelines, and visualized insights through interactive dashboards. The analysis includes performance metrics by route, aircraft type, and seasonal trends, helping identify factors affecting flight punctuality."
  image: "/assets/images/British-Airways-Logo-1997-present.jpg"
  repo: "https://github.com/omaryoussef20182019/british_airways"
  demo: ""
  tags: ["Python","Machine Learning","Data Analysis","EDA","Regression","Dashboard"]



    


